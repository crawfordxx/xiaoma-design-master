# xiaoma-gen Provider 注册表 — 唯一允许出现具体模型名的地方。
# 密钥只存环境变量名/文件路径，不存值。

# ---------------------------------------------------------------- wlyd 中转
[providers.wlyd]
enable = true
key_env = "WLYD_API_KEY"
key_file = "~/.wlyd-api-key"
base = "https://agentwan.wdsheng.com"
protocol = "openai-chat"   # 统一走 /v1/chat/completions，媒体 URL 在回复文本里

[providers.wlyd.caps.image.models."tt-image2"]
tier = "final"

[providers.wlyd.caps.video.models."seed-2.5"]
tier = "final"

[providers.wlyd.caps.video.models."seed-2"]
tier = "final"

[providers.wlyd.caps.video.models."seed-2-mini"]
tier = "draft"

[providers.wlyd.caps.video.models."seed-2-fast"]
tier = "draft"

[providers.wlyd.caps.video.models."seed-2.5-vision"]
tier = "final"
ref = true    # 图生视频：请求可带参考图

[providers.wlyd.caps.video.models."seed-2-mini-vision"]
tier = "draft"
ref = true

# ---------------------------------------------------------------- lumina 中转
# 模型清单待 Task 7 用 `gen models` 实时拉取后回填（draft/final 档位一并补全）。
[providers.lumina]
enable = true
key_env = "LUMINA_API_KEY"
key_file = "~/.lumina-api-key"
base = "https://api.lk888.ai/v1"
protocol = "lumina-skills"   # 私有 /v1/skills/* 协议，4 域降级

[providers.lumina.caps.image]
discover = "/v1/skills/models?type=image"

[providers.lumina.caps.video]
discover = "/v1/skills/models?type=video"

[providers.lumina.caps.llm]
discover = "/v1/models"

# ---------------------------------------------------------------- 默认档位
[defaults.video]
draft = "wlyd:seed-2-mini"
final = "wlyd:seed-2.5"

[defaults.image]
draft = ""          # 待 lumina 模型清单回填（低价档）
final = "wlyd:tt-image2"

[defaults.llm]
draft = ""
final = ""
